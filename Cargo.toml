[package]
name = "ngx-rustscript"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85.0"
build = "build.rs"

[package.metadata.ngx-rustscript]
ngx-rust-git = "https://github.com/nginx/ngx-rust"
ngx-rust-rev = "cda9d8372ccd2e139ef2b03e5806e019e7796187"
nginx-core-version = "1.31.4"
nginx-core-tarball-sha256 = "e6f20b644a17a643f059ae6467a1971fe2811587d025e071068753a1f1e3b3c3"
rustscript-git = "https://github.com/rustscript-lang/rustscript"
rustscript-rev = "b14f7d2edddbe23e996b953c7cc7ff6de2c0a809"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
libc = { version = "0.2", default-features = false, features = ["std"] }
md-5 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
nginx-sys = { git = "https://github.com/nginx/ngx-rust", rev = "cda9d8372ccd2e139ef2b03e5806e019e7796187" }
ngx = { git = "https://github.com/nginx/ngx-rust", rev = "cda9d8372ccd2e139ef2b03e5806e019e7796187", default-features = false, features = ["std"] }
pd-host-function = { git = "https://github.com/rustscript-lang/rustscript", rev = "b14f7d2edddbe23e996b953c7cc7ff6de2c0a809" }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "sync", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = { version = "1", default-features = false, features = ["std"] }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
vm = { package = "pd-vm", git = "https://github.com/rustscript-lang/rustscript", rev = "b14f7d2edddbe23e996b953c7cc7ff6de2c0a809", default-features = false, features = ["runtime", "async", "http-client", "sqlite"] }

[features]
default = ["export-modules"]
# Required to emit `ngx_modules` when building a cdylib outside the NGINX buildsystem.
export-modules = []

[build-dependencies]
cc = "1"

[dev-dependencies]
ngx-rustscript-nginx-test-stubs = { path = "tests/nginx_stubs" }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
