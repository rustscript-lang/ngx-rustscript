# Copy-paste async I/O -> HTTP -> SQLite -> shared-dict -> JSON example.
# Replace every /absolute/path/to/... placeholder before nginx -t / reload.
# Create /absolute/path/to/pipeline-data/upstream-url.txt with one permitted URL,
# for example http://127.0.0.1:18080/source.

load_module /absolute/path/to/libngx_rustscript.so;

worker_processes 1;
error_log /absolute/path/to/error.log info;
pid /absolute/path/to/nginx.pid;

events {
    worker_connections 128;
}

http {
    rss_shared_dict pipeline 1m;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        location = /pipeline {
            set $rss_pipeline_url_file /absolute/path/to/pipeline-data/upstream-url.txt;
            # SQLite paths are relative to rss_sqlite_root.
            set $rss_pipeline_database pipeline.db;

            # Every external capability is denied until granted here.
            rss_io_root /absolute/path/to/pipeline-data;
            rss_io_write off;
            rss_http_scheme http;
            rss_http_allow 127.0.0.1 18080;
            # Required only for loopback/private targets such as this demo upstream.
            rss_http_allow_private on;
            rss_sqlite_root /absolute/path/to/pipeline-data;

            content_by_rss_file /absolute/path/to/async-pipeline.rss;
        }
    }
}
