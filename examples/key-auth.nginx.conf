# WARNING: Copy-paste starting point only. Replace every REPLACE_* placeholder
# before use. Never commit live API tokens, peppers, or HMAC digests.
# Secrets live in a separate include (examples/key-auth-secrets.conf.example):
# mode 0600, owner = NGINX master/root, outside the web root. Replace that
# file atomically, then reload.
#
# HMAC-SHA1 is the only keyed digest host. This example verifies an opaque
# high-entropy token; it is not a message signature scheme.
#
# Trusted variables must come from the secrets include `set` directives,
# never from $http_*, $arg_*, or $cookie_*. Only the X-API-Key header is
# accepted; query-string tokens are unsupported and may be logged by
# `$request` (in addition to `$http_x_api_key`). Keep both names out of
# access_log / error_log formats.
#
# `underscores_in_headers on` may admit `X_API_Key` as a distinct inbound
# header. Keep it off (the NGINX default) and still clear `X_API_Key` on
# the upstream request.

load_module REPLACE_WITH_LIBNGX_RUSTSCRIPT_SO;

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
# Foreground / test harness. Production may use NGINX defaults instead.
daemon off;
master_process on;

events {
    worker_connections 64;
}

http {
    access_log logs/access.log combined;
    default_type text/plain;
    underscores_in_headers off;

    server {
        listen REPLACE_WITH_LISTEN;
        server_name localhost;

        include REPLACE_WITH_SECRETS_INCLUDE;

        location / {
            access_by_rss_file REPLACE_WITH_KEY_AUTH_RSS;

            proxy_pass REPLACE_WITH_UPSTREAM;
            proxy_http_version 1.1;
            proxy_set_header Connection close;
            # Empty value: NGINX omits the field from the upstream request.
            proxy_set_header X-API-Key "";
            proxy_set_header X_API_Key "";
        }
    }
}
