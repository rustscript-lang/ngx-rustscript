# Copy-paste shared-dict fixed-window rate limiter.
# Replace every /absolute/path/to/... placeholder before nginx -t / reload.

load_module /absolute/path/to/libngx_rustscript.so;

worker_processes 2;
error_log /absolute/path/to/error.log info;
pid /absolute/path/to/nginx.pid;

events {
    worker_connections 128;
}

http {
    # Shared across all workers. Size is the slab zone, not the request limit.
    # Size for expected concurrent in-window identities with headroom.
    # Undersizing fails closed (503) for new identities and never evicts a
    # live quota. See docs/examples/rate-limit.md.
    rss_shared_dict ratelimit 10m;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root /absolute/path/to/html;

        # Trusted identity for the script's ngx::var::get("rate_limit_key").
        # Default is the binary peer address. Behind a reverse proxy, use
        # ngx_http_realip with explicit set_real_ip_from so this variable is
        # overwritten; do not assign X-Forwarded-For / X-Real-IP here.
        # See docs/examples/rate-limit.md.
        set $rate_limit_key $binary_remote_addr;

        location / {
            access_by_rss_file /absolute/path/to/rate-limit.rss;
            # Content-phase handler. Do not use `return` in this location:
            # rewrite-phase `return` runs before access and skips the limiter.
            try_files /index.html =404;
        }
    }
}
